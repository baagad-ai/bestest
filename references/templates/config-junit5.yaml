# .bestest/config.yaml — JUnit 5 Stack
# Generated by bestest init for {{project_name}}
# Detected stack: {{detected_stack_summary}}

framework: junit5
language: java
version: "1.0"

# Coverage collection settings
# target: percentage goal for coverage (0-100)
# provider: JaCoCo for JVM coverage (line + branch)
coverage:
  enabled: true
  target: {{coverage_target}}
  provider: jacoco
  reporters:
    - xml
    - html

# File location patterns
# test: glob for test files (JUnit 5 tests)
# src: glob for source files (coverage target)
# ignore: patterns excluded from scanning and coverage
paths:
  test: "{{paths_test}}"
  src: "{{paths_src}}"
  ignore:
    - "**/target/**"
    - "**/build/**"
    - "**/.gradle/**"
    - "**/out/**"
    - "**/.bestest/**"
    - "**/generated/**"

# End-to-end testing
# framework: null for API-only Java projects, playwright for browser E2E
e2e:
  enabled: {{e2e_enabled}}
  framework: {{e2e_framework}}
  # config_path: playwright.config.ts  # uncomment when E2E is enabled

# Flaky-test retry policy for generated CI pipelines and E2E suites
flaky:
  retries: 2

# API testing settings
# MockMvc for Spring MVC, WebTestClient for WebFlux, null for non-HTTP
api:
  enabled: {{api_enabled}}
  framework: {{api_framework}}
  base_url: "http://localhost:8080"

# CI/CD pipeline integration
ci:
  enabled: {{ci_enabled}}
  provider: {{ci_provider}}

# JUnit 5-specific configuration
junit5:
  # build_tool: gradle or maven — determines test execution commands
  build_tool: {{junit5_build_tool}}
  # test_src_dir: path to test source root
  test_src_dir: "{{junit5_test_src_dir}}"
  # main_src_dir: path to main source root
  main_src_dir: "{{junit5_main_src_dir}}"
  # dependency_management: gradle or maven — how to declare dependencies
  dependency_management: {{junit5_dependency_management}}
  # coverage_provider: jacoco for JVM coverage
  coverage_provider: jacoco
  # use_junit_platform: configure JUnit Platform in build tool
  use_junit_platform: true
  # test_annotations: JUnit 5 annotations used in generated tests
  test_annotations:
    - "@Test"
    - "@ParameterizedTest"
    - "@Nested"
  # parallel_execution: enable JUnit 5 parallel test execution
  parallel_execution: false
  # java_version: source compatibility (from sourceCompatibility or default)
  java_version: "{{junit5_java_version}}"

# Test generation behavior
generation:
  # quality_threshold: minimum quality gate, normalized 0-1 (0.7 = score 70 on the 0-100 rubric)
  quality_threshold: 0.7
  # verify_compilation: run javac/gradle compile after generation
  verify_compilation: true
  # verify_pass: run generated tests to verify they pass
  verify_pass: true
  # max_retries: retry attempts when tests fail verification
  max_retries: 2

# Runtime state — DO NOT EDIT
# Managed automatically by bestest commands
state:
  last_scan: null
  last_generate: null
  last_run: null
  last_doctor: null
  version: "1.0"
