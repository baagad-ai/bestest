# .bestest/config.yaml — pytest Stack
# Generated by bestest init for {{project_name}}
# Detected stack: {{detected_stack_summary}}

framework: pytest
language: python
version: "1.0"

# Coverage collection settings
# target: percentage goal for coverage (0-100)
# provider: pytest-cov wraps coverage.py for pytest integration
coverage:
  enabled: true
  target: {{coverage_target}}
  provider: pytest-cov
  branch: true
  reporters:
    - term-missing
    - html
    - json

# File location patterns
# test: glob for test files
# src: glob for source files (coverage target)
# ignore: patterns excluded from scanning and coverage
paths:
  test: "{{paths_test}}"
  src: "{{paths_src}}"
  ignore:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/venv/**"
    - "**/.venv/**"
    - "**/site-packages/**"
    - "**/.bestest/**"
    - "**/migrations/**"

# End-to-end testing
# framework: playwright for browser testing, null for API-only projects
e2e:
  enabled: {{e2e_enabled}}
  framework: {{e2e_framework}}
  # config_path: playwright.config.ts  # uncomment when E2E is enabled

# Flaky-test retry policy for generated CI pipelines and E2E suites
flaky:
  retries: 2

# API testing settings
# httpx for FastAPI/modern async, requests for sync APIs
api:
  enabled: {{api_enabled}}
  framework: {{api_framework}}
  base_url: "http://localhost:8000"

# CI/CD pipeline integration
ci:
  enabled: {{ci_enabled}}
  provider: {{ci_provider}}

# pytest-specific configuration
pytest:
  config_path: pyproject.toml
  # asyncio_mode: auto enables @pytest.mark.asyncio implicitly for async functions
  asyncio_mode: {{pytest_asyncio_mode}}
  # plugins: list of pytest plugins to install and configure
  plugins: {{pytest_plugins}}
  # addopts: additional command-line options for pytest
  addopts:
    - "--strict-markers"
    - "--tb=short"
  # markers: custom test markers for categorization
  markers: {{pytest_markers}}
  # testpaths: directories to search for tests
  testpaths:
    - "{{paths_test_dir}}"

# Test generation behavior
generation:
  # quality_threshold: minimum quality gate, normalized 0-1 (0.7 = score 70 on the 0-100 rubric)
  quality_threshold: 0.7
  # verify_compilation: run syntax check after generation
  verify_compilation: true
  # verify_pass: run generated tests to verify they pass
  verify_pass: true
  # max_retries: retry attempts when tests fail verification
  max_retries: 2

# Runtime state — DO NOT EDIT
# Managed automatically by bestest commands
state:
  last_scan: null
  last_generate: null
  last_run: null
  last_doctor: null
  version: "1.0"
