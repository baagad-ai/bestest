# GitLab CI — 4-Stage Test Pipeline
# Generated by bestest ci gitlab-ci
#
# 4-stage architecture:
#   1. fast      — Unit tests (<5min), coverage gate
#   2. medium    — Integration tests (<20min), retry: 2
#   3. slow      — E2E / Playwright tests (<60min), retry: 2
#   4. quality   — Mutation testing / nightly (scheduled only)
#
# Multi-language monorepo: parallel jobs per detected language within each stage.
# Coverage gate reads coverage.target from .bestest/config.yaml (default: 80%).
#
# Prerequisites:
#   - .bestest/config.yaml with ci.enabled=true, ci.provider=gitlab-ci
#   - StackProfile at .bestest/state/stack-profile.json for language detection

stages:
  - fast
  - medium
  - slow
  - quality

variables:
  COVERAGE_THRESHOLD: "80"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "17"
  GO_VERSION: "1.22"

# Default retry for flaky stages (medium/slow)
.retry-flaky: &retry-flaky
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================================================
# Stage 1: Fast — Unit Tests
# ============================================================================

fast-js:
  stage: fast
  image: node:${NODE_VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - package.json
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    # JUnit XML output path aligns with ci.junit.outputPath from .bestest/config.yaml
    - mkdir -p .bestest/reports
    - npx vitest run --reporter=verbose --reporter=junit --outputFile=.bestest/reports/junit-js.xml src/**/*.test.{ts,tsx} --coverage
    - COVERAGE=$(cat coverage/coverage-summary.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).total.lines.pct))")
    - echo "JS/TS Coverage: ${COVERAGE}%"
    - test $(echo "$COVERAGE >= $COVERAGE_THRESHOLD" | bc -l) -eq 1
  coverage: '/Coverage: (\d+)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      junit: .bestest/reports/junit-js.xml

fast-python:
  stage: fast
  image: python:${PYTHON_VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - pyproject.toml
        - requirements.txt
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip/
  before_script:
    - pip install --cache-dir=.cache/pip -r requirements.txt pytest pytest-cov 2>/dev/null || pip install pytest pytest-cov
  script:
    # JUnit XML output path aligns with ci.junit.outputPath from .bestest/config.yaml
    - mkdir -p .bestest/reports
    - pytest tests/unit/ -m unit -v --tb=short --cov --cov-report=json:coverage.json --junitxml=.bestest/reports/junit-python.xml
    - COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
    - echo "Python Coverage: ${COVERAGE}%"
    - test $(echo "$COVERAGE >= $COVERAGE_THRESHOLD" | bc -l) -eq 1
  coverage: '/Coverage: (\d+)%/'
  artifacts:
    paths:
      - coverage.json
    reports:
      junit: .bestest/reports/junit-python.xml

fast-java:
  stage: fast
  image: eclipse-temurin:${JAVA_VERSION}-jdk
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - build.gradle
        - pom.xml
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/
  script:
    - |
      if [ -f "gradlew" ]; then
        ./gradlew test --no-daemon jacocoTestReport
      elif [ -f "mvnw" ]; then
        ./mvnw test jacoco:report
      fi
  artifacts:
    paths:
      - build/reports/jacoco/
    reports:
      junit: build/test-results/**/*.xml

fast-go:
  stage: fast
  image: golang:${GO_VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - go.mod
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  script:
    # JUnit XML output path aligns with ci.junit.outputPath from .bestest/config.yaml
    - mkdir -p .bestest/reports
    - go install gotest.tools/gotestsum@latest
    - gotestsum --junitfile .bestest/reports/junit-go.xml -- -short -v -coverprofile=coverage.out -covermode=atomic ./...
    - COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
    - echo "Go Coverage: ${COVERAGE}%"
    - test $(echo "$COVERAGE >= $COVERAGE_THRESHOLD" | bc -l) -eq 1
  coverage: '/Coverage: (\d+)%/'
  artifacts:
    paths:
      - coverage.out
    reports:
      junit: .bestest/reports/junit-go.xml

# ============================================================================
# Stage 2: Medium — Integration Tests
# ============================================================================

medium-js:
  stage: medium
  image: node:${NODE_VERSION}
  needs: [fast-js]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - package.json
      when: on_success
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  <<: *retry-flaky
  before_script:
    - npm ci
  script:
    # JUnit XML output path aligns with ci.junit.outputPath from .bestest/config.yaml
    - mkdir -p .bestest/reports
    - npx vitest run --reporter=verbose --reporter=junit --outputFile=.bestest/reports/junit-js-integration.xml "tests/integration/**"

medium-python:
  stage: medium
  image: python:${PYTHON_VERSION}
  needs: [fast-python]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - pyproject.toml
        - requirements.txt
      when: on_success
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip/
  <<: *retry-flaky
  before_script:
    - pip install --cache-dir=.cache/pip -r requirements.txt pytest 2>/dev/null || pip install pytest
  script:
    # JUnit XML output path aligns with ci.junit.outputPath from .bestest/config.yaml
    - mkdir -p .bestest/reports
    - pytest tests/integration/ -m integration -v --tb=short --junitxml=.bestest/reports/junit-python-integration.xml

medium-java:
  stage: medium
  image: eclipse-temurin:${JAVA_VERSION}-jdk
  needs: [fast-java]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - build.gradle
        - pom.xml
      when: on_success
  <<: *retry-flaky
  script:
    - |
      if [ -f "gradlew" ]; then
        ./gradlew integrationTest --no-daemon
      elif [ -f "mvnw" ]; then
        ./mvnw verify -Dgroups="integration"
      fi

medium-go:
  stage: medium
  image: golang:${GO_VERSION}
  needs: [fast-go]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - go.mod
      when: on_success
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  <<: *retry-flaky
  script:
    # JUnit XML output path aligns with ci.junit.outputPath from .bestest/config.yaml
    - mkdir -p .bestest/reports
    - go install gotest.tools/gotestsum@latest
    - gotestsum --junitfile .bestest/reports/junit-go-integration.xml -- -v -tags=integration ./integration/... ./itest/...

# ============================================================================
# Stage 3: Slow — E2E Tests
# ============================================================================

slow-js:
  stage: slow
  image: node:${NODE_VERSION}
  needs: [medium-js]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - package.json
      when: on_success
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  <<: *retry-flaky
  before_script:
    - npm ci
    - npx playwright install --with-deps
  script:
    - npx playwright test
  artifacts:
    when: on_failure
    paths:
      - playwright-report/

slow-python:
  stage: slow
  image: python:${PYTHON_VERSION}
  needs: [medium-python]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - pyproject.toml
        - requirements.txt
      when: on_success
  <<: *retry-flaky
  before_script:
    - pip install -r requirements.txt pytest playwright 2>/dev/null || pip install pytest playwright
    - playwright install --with-deps
  script:
    - pytest tests/e2e/ -m e2e -v --tb=short

slow-java:
  stage: slow
  image: eclipse-temurin:${JAVA_VERSION}-jdk
  needs: [medium-java]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - build.gradle
      when: on_success
  <<: *retry-flaky
  script:
    - ./gradlew e2eTest --no-daemon

# ============================================================================
# Stage 4: Quality — Mutation Testing (Scheduled only)
# ============================================================================

quality-mutation:
  stage: quality
  image: node:${NODE_VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - npx stryker run
    - SCORE=$(jq '.mutationScore' reports/mutation/json)
    - echo "Mutation Score: ${SCORE}%"
    - test $(echo "$SCORE >= 80" | bc -l) -eq 1

quality-go-nightly:
  stage: quality
  image: golang:${GO_VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  script:
    # JUnit XML output path aligns with ci.junit.outputPath from .bestest/config.yaml
    - mkdir -p .bestest/reports
    - go install gotest.tools/gotestsum@latest
    - gotestsum --junitfile .bestest/reports/junit-go-nightly.xml -- -v -race -coverprofile=coverage-nightly.out -covermode=atomic ./...
    - COVERAGE=$(go tool cover -func=coverage-nightly.out | grep total | awk '{print $3}' | tr -d '%')
    - echo "Go Nightly Coverage: ${COVERAGE}%"
    - test $(echo "$COVERAGE >= $COVERAGE_THRESHOLD" | bc -l) -eq 1
  artifacts:
    reports:
      junit: .bestest/reports/junit-go-nightly.xml
