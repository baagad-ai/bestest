# GitHub Actions — 4-Stage Test Pipeline
# Generated by bestest ci github-actions
#
# 4-stage architecture:
#   1. fast      — Unit tests (<5min), coverage gate
#   2. medium    — Integration tests (<20min), retry on flaky
#   3. slow      — E2E / Playwright tests (<60min), retry on flaky
#   4. quality   — Mutation testing / nightly (scheduled only)
#
# Multi-language monorepo: parallel jobs per detected language within each stage.
# Coverage gate reads coverage.target from .bestest/config.yaml (default: 80%).
#
# Prerequisites:
#   - .bestest/config.yaml with ci.enabled=true, ci.provider=github-actions
#   - StackProfile at .bestest/state/stack-profile.json for language detection

name: Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC — runs Stage 4 (Quality)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Max stage to run (fast/medium/slow/quality)'
        required: false
        default: 'slow'

concurrency:
  group: test-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: 80
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'
  GO_VERSION: '1.22'

# ============================================================================
# Stage 1: Fast — Unit Tests
# ============================================================================
jobs:
  # --- JavaScript/TypeScript Unit Tests ---
  fast-js:
    name: Fast – JS/TS Unit Tests
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run Unit Tests (Vitest)
        run: npx vitest run --reporter=verbose src/**/*.test.{ts,tsx} --coverage
      - name: Coverage Gate
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "JS/TS Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-js
          path: coverage/

  # --- Python Unit Tests ---
  fast-python:
    name: Fast – Python Unit Tests
    runs-on: ubuntu-latest
    if: hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt pytest pytest-cov 2>/dev/null || pip install pytest pytest-cov
      - name: Run Unit Tests (pytest)
        run: pytest tests/unit/ -m unit -v --tb=short --cov --cov-report=json:coverage.json
      - name: Coverage Gate
        run: |
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
          echo "Python Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.json

  # --- Java Unit Tests ---
  fast-java:
    name: Fast – Java Unit Tests
    runs-on: ubuntu-latest
    if: hashFiles('build.gradle') != '' || hashFiles('pom.xml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Run Unit Tests (Gradle)
        if: hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != ''
        run: ./gradlew test --no-daemon jacocoTestReport
      - name: Run Unit Tests (Maven)
        if: hashFiles('pom.xml') != ''
        run: ./mvnw test jacoco:report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-java
          path: build/reports/jacoco/

  # --- Go Unit Tests ---
  fast-go:
    name: Fast – Go Unit Tests
    runs-on: ubuntu-latest
    if: hashFiles('go.mod') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - name: Run Unit Tests
        run: go test -short -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage Gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Go Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage.out

  # ============================================================================
  # Stage 2: Medium — Integration Tests
  # ============================================================================
  medium-js:
    name: Medium – JS/TS Integration
    runs-on: ubuntu-latest
    needs: [fast-js]
    if: always() && needs.fast-js.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run Integration Tests (with retry)
        run: |
          for i in 1 2 3; do
            npx vitest run --reporter=verbose "tests/integration/**" && break || echo "Attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 10
          done

  medium-python:
    name: Medium – Python Integration
    runs-on: ubuntu-latest
    needs: [fast-python]
    if: always() && needs.fast-python.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt pytest 2>/dev/null || pip install pytest
      - name: Run Integration Tests (with retry)
        run: |
          for i in 1 2 3; do
            pytest tests/integration/ -m integration -v --tb=short && break || echo "Attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 10
          done

  medium-java:
    name: Medium – Java Integration
    runs-on: ubuntu-latest
    needs: [fast-java]
    if: always() && needs.fast-java.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Run Integration Tests (with retry)
        run: |
          for i in 1 2 3; do
            ./gradlew integrationTest --no-daemon && break || echo "Attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 10
          done

  medium-go:
    name: Medium – Go Integration
    runs-on: ubuntu-latest
    needs: [fast-go]
    if: always() && needs.fast-go.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run Integration Tests (with retry)
        run: |
          for i in 1 2 3; do
            go test -v -tags=integration ./integration/... ./itest/... && break || echo "Attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 10
          done

  # ============================================================================
  # Stage 3: Slow — E2E Tests
  # ============================================================================
  slow-js:
    name: Slow – JS/TS E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [medium-js]
    if: always() && needs.medium-js.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run E2E Tests (with retry)
        run: |
          for i in 1 2 3; do
            npx playwright test && break || echo "Attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 15
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  slow-python:
    name: Slow – Python E2E
    runs-on: ubuntu-latest
    needs: [medium-python]
    if: always() && needs.medium-python.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt pytest playwright 2>/dev/null || pip install pytest playwright
      - run: playwright install --with-deps
      - name: Run E2E Tests (with retry)
        run: |
          for i in 1 2 3; do
            pytest tests/e2e/ -m e2e -v --tb=short && break || echo "Attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 15
          done

  slow-java:
    name: Slow – Java E2E
    runs-on: ubuntu-latest
    needs: [medium-java]
    if: always() && needs.medium-java.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Run E2E Tests (with retry)
        run: |
          for i in 1 2 3; do
            ./gradlew e2eTest --no-daemon && break || echo "Attempt $i failed, retrying..."
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 15
          done

  # ============================================================================
  # Stage 4: Quality — Mutation Testing (Nightly/Manual only)
  # ============================================================================
  quality:
    name: Quality – Mutation Testing
    runs-on: ubuntu-latest
    needs: [slow-js]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'quality')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run Mutation Tests (Stryker)
        run: npx stryker run
      - name: Mutation Score Gate
        run: |
          SCORE=$(jq '.mutationScore' reports/mutation/json)
          echo "Mutation Score: ${SCORE}%"
          if [ "$(echo "$SCORE < 80" | bc -l)" -eq 1 ]; then
            echo "::error::Mutation score ${SCORE}% is below threshold 80%"
            exit 1
          fi
