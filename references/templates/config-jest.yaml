# .bestest/config.yaml — Jest Stack
# Generated by bestest init for {{project_name}}
# Detected stack: {{detected_stack_summary}}
# Note: Existing Jest setup detected. This config references your existing jest.config.
# Review jest.config_path below to ensure it points to your actual config file.

framework: jest
language: typescript
version: "1.0"

# Coverage collection settings
# provider: istanbul is the standard Jest coverage provider
coverage:
  enabled: true
  target: {{coverage_target}}
  provider: istanbul
  reporters:
    - text
    - html
    - json-summary

# File location patterns
paths:
  test: "{{paths_test}}"
  src: "{{paths_src}}"
  ignore:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/.bestest/**"

# End-to-end testing
e2e:
  enabled: {{e2e_enabled}}
  framework: {{e2e_framework}}
  # config_path: playwright.config.ts  # uncomment when E2E is enabled

# Flaky-test retry policy for generated CI pipelines and E2E suites
flaky:
  retries: 2

# CI/CD pipeline integration
ci:
  enabled: {{ci_enabled}}
  provider: {{ci_provider}}

# Vitest configuration (not used when framework is jest)
vitest: {}

# Jest-specific configuration
jest:
  # config_path: should point to your existing Jest config file
  config_path: {{jest_config_path}}
  # transform: strategy for handling TypeScript
  # swc: fastest, requires @swc/jest
  # babel: flexible, requires babel-jest + presets
  # ts-jest: TypeScript-native, good compatibility
  transform: {{jest_transform}}
  # environment: jsdom for DOM testing, node for API-only
  environment: {{jest_environment}}
  # module_name_mapper: path aliases from tsconfig.json
  module_name_mapper: {{jest_module_name_mapper}}

# Monorepo settings
monorepo:
  enabled: false
  tool: null
  packages: []

# Test generation behavior
generation:
  quality_threshold: 0.7
  verify_compilation: true
  verify_pass: true
  max_retries: 2

# Runtime state — DO NOT EDIT
state:
  last_scan: null
  last_generate: null
  last_run: null
  version: "1.0"
