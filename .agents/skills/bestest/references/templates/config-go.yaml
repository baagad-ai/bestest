# .bestest/config.yaml — Go Testing Stack
# Generated by bestest init for {{project_name}}
# Detected stack: {{detected_stack_summary}}

framework: go_testing
language: go
version: "1.0"

# Coverage collection settings
# target: percentage goal for coverage (0-100)
# provider: go test -coverprofile (built into Go toolchain)
coverage:
  enabled: true
  target: {{coverage_target}}
  provider: go_cover
  mode: atomic
  reporters:
    - func
    - html

# File location patterns
# test: glob for test files (Go convention: *_test.go)
# src: glob for source files (coverage target)
# ignore: patterns excluded from scanning and coverage
paths:
  test: "{{paths_test}}"
  src: "{{paths_src}}"
  ignore:
    - "**/vendor/**"
    - "**/.git/**"
    - "**/.bestest/**"
    - "**/testdata/**"
    - "**/*_string.go"
    - "**/mock/**"
    - "**/pb/**"

# End-to-end testing
# framework: null for API-only Go projects, playwright for browser E2E
e2e:
  enabled: {{e2e_enabled}}
  framework: {{e2e_framework}}

# API testing settings
# httptest for stdlib/Gin/Echo handlers, bufconn for gRPC, null for non-HTTP
api:
  enabled: {{api_enabled}}
  framework: {{api_framework}}
  base_url: "http://localhost:8080"

# CI/CD pipeline integration
ci:
  enabled: {{ci_enabled}}
  provider: {{ci_provider}}

# Go-specific configuration
go:
  # go_module_path: module path from go.mod (e.g., "github.com/user/project")
  module_path: "{{go_module_path}}"
  # go_version: Go version from go.mod directive (e.g., "1.22")
  go_version: "{{go_go_version}}"
  # test_timeout: global timeout for go test (e.g., "30s", "5m")
  test_timeout: "5m"
  # race_detection: enable -race flag for race condition detection
  race_detection: true
  # verbose: enable -v flag for verbose test output
  verbose: true
  # cover_mode: coverage mode (set, count, atomic) — atomic for race-safe coverage
  cover_mode: atomic
  # build_tags: build tags for conditional compilation (e.g., ["integration"])
  build_tags: []
  # test_packages: packages to test (e.g., ["./..."] for all, or specific packages)
  test_packages:
    - "./..."
  # testify: testify configuration
  testify:
    enabled: true
    # packages: which testify packages to use
    packages:
      - assert
      - require
    # suite: enable suite.Suite for structured test grouping
    suite: false
    # mock: enable mock.Mock for interaction testing
    mock: false
  # mocking_strategy: preferred mocking approach
  # "interface_fakes" = manual interface implementations (Go idiom, preferred)
  # "testify_mock" = testify/mock package (lightweight, no code generation)
  # "gomock" = go.uber.org/mock + mockgen (type-safe, generated mocks)
  mocking_strategy: {{go_mocking_strategy}}
  # http_framework: detected HTTP framework for test pattern selection
  # "none" = non-HTTP project
  # "stdlib" = net/http standard library
  # "gin" = Gin framework
  # "echo" = Echo framework
  # "chi" = Chi router
  # "grpc" = gRPC services
  http_framework: "{{go_http_framework}}"
  # parallel: enable t.Parallel() in generated tests where safe
  parallel: true
  # fuzz: enable fuzz testing support (Go 1.18+)
  fuzz: false

# Test generation behavior
generation:
  # quality_threshold: minimum self-assessed quality score (0-1)
  quality_threshold: 0.7
  # verify_compilation: run go vet + go build after generation
  verify_compilation: true
  # verify_pass: run generated tests to verify they pass
  verify_pass: true
  # max_retries: retry attempts when tests fail verification
  max_retries: 2

# Runtime state — DO NOT EDIT
# Managed automatically by bestest commands
state:
  last_scan: null
  last_generate: null
  last_run: null
  last_doctor: null
  version: "1.0"
