# .bestest/config.yaml — Monorepo Stack
# Generated by bestest init for {{project_name}}
# Detected stack: {{detected_stack_summary}}
# Monorepo tool: {{monorepo_tool}}

framework: vitest
version: "1.0"

# Coverage collection settings
# Coverage is collected per-package and unified at the root level
coverage:
  enabled: true
  target: {{coverage_target}}
  provider: v8
  reporters:
    - text
    - html
    - json-summary

# File location patterns
# In monorepos, these apply across all packages
paths:
  test: "**/*.{test,spec}.{ts,tsx}"
  src: "**/*.{ts,tsx}"
  ignore:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/.bestest/**"

# End-to-end testing
e2e:
  enabled: {{e2e_enabled}}
  framework: {{e2e_framework}}

# CI/CD pipeline integration
ci:
  enabled: {{ci_enabled}}
  provider: {{ci_provider}}

# Vitest-specific configuration (monorepo)
# IMPORTANT: Vitest 3.2+ uses `projects` in the root config, NOT `workspace`
# The root vitest.config.ts should use defineConfig with a projects array
# pointing to each package's vitest.config.ts
vitest:
  config_path: vitest.config.ts
  globals: false
  # Default environment — individual packages override in their own configs
  environment: {{vitest_environment}}
  setup_files: {{vitest_setup_files}}
  include:
    - "**/*.{test,spec}.{ts,tsx}"

# Per-package guidance:
# Each package in monorepo.packages should have its own vitest.config.ts:
#   - Apps with React: environment jsdom, include @vitejs/plugin-react
#   - API packages: environment node, no DOM plugins
#   - Shared libraries: inherit root environment or set per-package
#
# Root vitest.config.ts example for monorepo:
#   import { defineConfig } from 'vitest/config'
#   export default defineConfig({
#     test: {
#       projects: ['packages/*'],  // NOT workspace (deprecated in Vitest 3.2+)
#     },
#   })
#
# Filter tests to a specific package:
#   vitest --project=package-name

jest: {}

# Monorepo configuration
monorepo:
  enabled: true
  # tool: monorepo orchestrator detected from project
  tool: {{monorepo_tool}}
  # packages: glob patterns or explicit paths for workspace packages
  packages: {{monorepo_packages}}

# Test generation behavior
# Generation targets packages independently
generation:
  quality_threshold: 0.7
  verify_compilation: true
  verify_pass: true
  max_retries: 2

# Runtime state — DO NOT EDIT
state:
  last_scan: null
  last_generate: null
  last_run: null
  version: "1.0"
