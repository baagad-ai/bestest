# .bestest/config.yaml — Vitest Stack
# Generated by bestest init for {{project_name}}
# Detected stack: {{detected_stack_summary}}

framework: vitest
version: "1.0"

# Coverage collection settings
# target: percentage goal for coverage (0-100)
# provider: v8 is faster, istanbul has more precise branch coverage
coverage:
  enabled: true
  target: {{coverage_target}}
  provider: v8
  reporters:
    - text
    - html
    - json-summary

# File location patterns
# test: glob for test files
# src: glob for source files (coverage target)
# ignore: patterns excluded from scanning and coverage
paths:
  test: "{{paths_test}}"
  src: "{{paths_src}}"
  ignore:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/.bestest/**"

# End-to-end testing
# framework: playwright for browser testing, null for API-only projects
e2e:
  enabled: {{e2e_enabled}}
  framework: {{e2e_framework}}

# CI/CD pipeline integration
ci:
  enabled: {{ci_enabled}}
  provider: {{ci_provider}}

# Vitest-specific configuration
vitest:
  config_path: vitest.config.ts
  # globals: true allows describe/it/expect without imports
  globals: false
  # environment: jsdom for React/Vue/Svelte DOM testing, node for API-only
  environment: {{vitest_environment}}
  # setup_files: paths to setup files run before each test suite
  setup_files: {{vitest_setup_files}}
  include:
    - "{{paths_test}}"

# Jest configuration (not used when framework is vitest)
jest: {}

# Monorepo settings (not applicable for single-package projects)
monorepo:
  enabled: false
  tool: null
  packages: []

# Test generation behavior
generation:
  # quality_threshold: minimum self-assessed quality score (0-1)
  quality_threshold: 0.7
  # verify_compilation: run type-check after generation
  verify_compilation: true
  # verify_pass: run generated tests to verify they pass
  verify_pass: true
  # max_retries: retry attempts when tests fail verification
  max_retries: 2

# Runtime state — DO NOT EDIT
# Managed automatically by bestest commands
state:
  last_scan: null
  last_generate: null
  last_run: null
  version: "1.0"
