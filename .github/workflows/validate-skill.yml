name: Validate Bestest Skill

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SKILL_DIR: ${{ github.workspace }}/.agents/skills/bestest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run validation script
        run: |
          chmod +x "$SKILL_DIR/scripts/validate-skill.sh"
          "$SKILL_DIR/scripts/validate-skill.sh"
